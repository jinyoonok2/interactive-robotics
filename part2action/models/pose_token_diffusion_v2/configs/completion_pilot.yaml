# Same action batches/update budget as the original pilot; separate completion queries.
model_config: model.yaml
data:
  train_hdf5:
    - /p/part2action/data/PartInstruct/demos/bottle.hdf5
    - /p/part2action/data/PartInstruct/demos/mug.hdf5
    - /p/part2action/data/PartInstruct/demos/pliers.hdf5
    - /p/part2action/data/PartInstruct/demos/scissors.hdf5
  action_target_offset: 1
  action_chunk: 8
  n_obs_steps: 2
  max_skill_slots: 4
  sample_stride: 1
  max_demos_per_file: null
  demo_manifest: null
  batch_size: 16
  num_workers: 2
  pin_memory: true
  validation_fraction: 0.1
  split_seed: 42
  use_pcd: true
  use_tcp_pose: true
  use_hierarchy: true
  use_point_part_labels: true
  use_part_pcd: false
  use_contact_xyz: false
goal_labels:
  touch_max_distance_m: 0.03
  touch_probe_offset_m: 0.05625
completion:
  post_transition_steps: 8
  allow_endpoint_proxy: true
train:
  initialization: random_policy_frozen_backbones
  reference_initialization: /p/part2action/results/diagnostics/pose_token_diffusion_v2_pilot_20261116_01/training/initialization.json
  seed: 42
  epochs: 2
  lr: 0.0001
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  validation_max_batches: null
  validation_examples: 5
  log_every_steps: 50
  require_demo_manifest: true
losses:
  action_weight: 1.0
  goal_position_weight: 1.0
  goal_rotation_weight: 1.0
  goal_opening_weight: 0.25
  goal_applicability_weight: 0.1
  goal_skill_weight: 0.25
  grounding_region_weight: 1.0
  gate_weight: 0.5
  skill_embedding_weight: 1.0
  slot_validity_weight: 0.25
  phase_weight: 0.5
  termination_weight: 0.5
  termination_pos_weight: 1.0
